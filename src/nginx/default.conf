upstream api-dev-server {
    server api:8002 max_fails=0;
}

server {
    listen 8002;
    server_name api.comments;

    client_max_body_size 10M;

    location /media/ {
        alias /app/media/;
        charset utf-8;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://api-dev-server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:8002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

upstream api-gunicorn {
    server api-locust:8003 max_fails=0;
    server api-locust:8003 max_fails=0;
    server api-locust:8003 max_fails=0;
    server api-locust:8003 max_fails=0;
    keepalive 12;
}

server {
    listen 8003;
    server_name api.comments;

    client_max_body_size 10M;

    location /media/ {
        alias /app/media/;
        charset utf-8;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://api-gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:8003;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;

        proxy_buffering off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # If gunicorn closes a connection during restart, Nginx will retry
        proxy_next_upstream error timeout invalid_header http_502;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
    }
}

server {
    listen 8002;
    server_name web.comments;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
