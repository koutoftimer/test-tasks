server {
    listen 8002;
    server_name api.comments;

    client_max_body_size 10M;

    location /media/ {
        alias /app/media/;
        charset utf-8;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://api:8002;
        proxy_set_header Host $host:8002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
}

server {
    listen 8003;
    server_name api.comments;

    client_max_body_size 10M;

    location /media/ {
        alias /app/media/;
        charset utf-8;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://api-locust:8003;
        proxy_set_header Host $host:8003;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
}

server {
    listen 8002;
    server_name web.comments;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
