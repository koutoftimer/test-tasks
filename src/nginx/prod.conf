upstream api {
    server api:8002;
}

server {
    listen 80;
    server_name comments.ruslan-kovtun.pp.ua;

    client_max_body_size 10M;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/comments.access.log;
    error_log /var/log/nginx/comments.error.log;
}

server {
    listen 80;
    server_name api-comments.ruslan-kovtun.pp.ua;

    client_max_body_size 10M;

    location /media/ {
        alias /app/media/;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/api-comments.access.log;
    error_log /var/log/nginx/api-comments.error.log;
}
