upstream api {
    server api:8002 max_fails=0;
    server api:8002 max_fails=0;
    server api:8002 max_fails=0;
    server api:8002 max_fails=0;
    keepalive 12;
}

server {
    listen 80;
    server_name comments.ruslan-kovtun.pp.ua;

    client_max_body_size 10M;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/comments.access.log;
    error_log /var/log/nginx/comments.error.log;
}

server {
    listen 80;
    server_name api-comments.ruslan-kovtun.pp.ua;

    client_max_body_size 10M;

    location /media/ {
        alias /app/media/;
        charset utf-8;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Ensure the 'Origin' header is preserved so Django-CORS can see it
        proxy_set_header Origin $http_origin;

        proxy_buffering off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # If gunicorn closes a connection during restart, Nginx will retry
        proxy_next_upstream error timeout invalid_header http_502;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
    }

    access_log /var/log/nginx/api-comments.access.log;
    error_log /var/log/nginx/api-comments.error.log;
}
