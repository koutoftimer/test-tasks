services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments -d comments"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    expose:
      - "8002"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8002"

  nginx:
    image: nginx:1.31
    ports:
      - "8002:8002"
    volumes:
      - ./src/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/frontend/dist:/usr/share/nginx/html
      - ./src/backend/media:/app/media
      - ./src/backend/static:/app/static
    depends_on:
      - api

volumes:
  postgres:
