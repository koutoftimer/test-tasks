services:
  db:
    image: postgres:18
    shm_size: 256m
    env_file:
      - .env
    volumes:
      - postgres_v18:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments -d comments"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    env_file:
      - .env
    ports:
      - "6432:6432"
    depends_on:
      - db
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: comments-api
    expose:
      - "8002"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8002"

  test:
    image: comments-api
    profiles:
      - test
    environment:
      - DJANGO_SETTINGS_MODULE=comments.settings_test
    volumes:
      - ./src/backend:/app
    command: python manage.py test --parallel

  nginx:
    image: nginx:1.31
    ports:
      - "8002:8002"
    volumes:
      - ./src/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/frontend/dist:/usr/share/nginx/html
      - ./src/backend/media:/app/media
      - ./src/backend/static:/app/static
    depends_on:
      - api

volumes:
  # Reference the manually created volume
  postgres_v18:
    external: true
