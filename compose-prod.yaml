services:
  db:
    image: postgres:18
    env_file:
      - .env.prod
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments -d comments"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "8002"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/static
    restart: unless-stopped

  frontend-builder:
    image: node:24
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - frontend-dist:/app/dist
    environment:
      - VITE_API_BASE=https://api-comments.ruslan-kovtun.pp.ua
    command: sh -c "npm ci && npm run build"

  nginx:
    image: nginx:1.31
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
      - media:/app/media:ro
      - static:/app/static:ro
      - nginx-logs:/var/log/nginx/
    depends_on:
      api:
        condition: service_started
      frontend-builder:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:
  media:
  static:
  frontend-dist:
  nginx-logs:
