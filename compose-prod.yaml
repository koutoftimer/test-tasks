services:
  redis-warmer:
    image: comments-api
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    # We only run sync if Redis is empty
    command: >
      sh -c "if [ $$(redis-cli -h redis EXISTS v:c) -eq 0 ]; then
               python manage.py sync_votes_to_redis;
             fi"

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:18
    shm_size: 1024m
    env_file:
      - .env.prod
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$DB_USER -d $$DB_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    env_file:
      - .env.prod
    depends_on:
      - db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5432  -U $$DB_USER -d $$DB_NAME']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: comments-api
    expose:
      - "8002"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/static
    restart: unless-stopped

  frontend-builder:
    image: node:24
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - frontend-dist:/app/dist
    environment:
      - VITE_API_BASE=https://api-comments.ruslan-kovtun.pp.ua
    command: sh -c "npm ci && npm run build"

  nginx:
    image: nginx:1.31
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
      - media:/app/media:ro
      - static:/app/static:ro
      - nginx-logs:/var/log/nginx/
    depends_on:
      api:
        condition: service_started
      frontend-builder:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:
  media:
  static:
  frontend-dist:
  nginx-logs:
